version: '3.8'

services:
  # 1. Local LLM Service (Air-Gapped Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: railmind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped

  # 2. RailMind FastAPI Backend
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: railmind-backend
    ports:
      - "8001:8001"
    volumes:
      - ../../backend:/app/backend
    environment:
      - PORT=8001
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # 3. RailMind React / Vite Frontend Dashboard
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: railmind-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
